[build]
  command = "composer install --no-dev --no-interaction && npm run prod"
  publish = "build_production"

[build.environment]
  NODE_VERSION = "26"
  PHP_VERSION = "8.3"

[[headers]]
  for = "/assets/fonts/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"
